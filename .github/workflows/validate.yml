name: validate
on: [push, pull_request]
jobs:
  shacl:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - name: Regenerar a partir dos CSV e conferir que nada mudou
        run: |
          python3 scripts/build.py
          git diff --exit-code ontology/generated docs/mapeamentos.md lean/Invariantes.lean
      - run: uv run python scripts/validate.py
  lean:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Instalar Lean (elan)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Verificar invariantes
        working-directory: lean
        run: lean Invariantes.lean
